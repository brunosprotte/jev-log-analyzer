[project]
name = "log-triage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "uvicorn~=0.32",
    "httpx~=0.27",
    "pydantic~=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]